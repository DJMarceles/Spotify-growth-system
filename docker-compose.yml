version: '3.9'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: release_loop_os
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  scoring:
    build:
      context: ./services/scoring
      dockerfile: Dockerfile
    ports:
      - '8000:8000'
    environment:
      - LOG_LEVEL=info

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '3000:3000'
    depends_on:
      - db
      - scoring
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/release_loop_os
      SCORING_SERVICE_URL: http://scoring:8000

volumes:
  pgdata:
